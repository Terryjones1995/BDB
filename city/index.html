<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- BDB City (working title). Built on Fable Cities by raw (MIT): see NOTICE.md and PLAN.md in this folder.
         No build step: plain ES modules, three.js r185 vendored under vendor/three and found through the import map below. -->
    <title>BDB City</title>
    <meta name="description" content="Be the mayor. Lay roads, zone land and grow a real 3D city. BDB will have opinions." />
    <meta property="og:image" content="../assets/face.jpg" />
    <link rel="icon" href="../assets/face.jpg" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f14; }
      body { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; color: #e8edf2; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #ui-root > * { pointer-events: auto; }
      #loading { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(1200px 800px at 50% 40%, #16202b 0%, #0b0f14 70%); transition: opacity .6s ease; }
      #loading.hidden { opacity: 0; pointer-events: none; }
      #loading h1 { font-weight: 300; letter-spacing: .35em; font-size: 28px; margin: 0 0 18px; text-transform: uppercase; color: #dfe7ef; }
      #loading .bar { width: 320px; max-width: 70vw; height: 3px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
      #loading .bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #ff8a2b, #f2c14e); transition: width .3s ease; }
      #loading .status { margin-top: 12px; font-size: 12px; letter-spacing: .12em; color: #8da0b3; text-transform: uppercase; }
      #loading .home { position: absolute; top: 18px; left: 18px; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
        color: #8fa3cc; text-decoration: none; padding: 8px 10px; border-radius: 8px; }
      #loading .home:hover, #loading .home:focus-visible { color: #f2c14e; background: rgba(255,255,255,.05); }
    </style>
    <link rel="stylesheet" href="./src/modules/ui/ui.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three/build/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
    </script>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="ui-root"></div>
    <div id="loading">
      <a class="home" href="../">&larr; All games</a>
      <h1>BDB City</h1>
      <div class="bar"><i id="loading-bar"></i></div>
      <div class="status" id="loading-status">Initialising</div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
