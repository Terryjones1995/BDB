<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- TEMPLATE for a BDB game page. Copy to /<folder>/index.html and replace the GAME sections.
     The demo game below (tap the BDB heads) shows every shared piece wired up: splash, HUD, speech bubble,
     dock, end screen, local top-5 scores, roasts, sounds, resize, pause when hidden. -->
<title>Template Game</title>
<meta name="description" content="One sentence about the game.">
<meta property="og:image" content="../assets/face.jpg">
<link rel="icon" href="../assets/face.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Teko:wght@500;600&family=Figtree:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/kit.css">
<style>
/* GAME: page-specific styles only. Use the kit tokens (var(--orange) etc.), never one-off colours that fight the kit. */
</style>
<script src="../assets/roasts.js"></script>
<script src="../assets/kit.js"></script>
</head>
<body class="k">

<section class="k-splash" id="splash">
  <div class="k-splash-in">
    <a class="k-home" href="../">← All games</a>
    <div class="k-face" aria-hidden="true"></div>
    <div class="k-eyebrow">BDB Entertainment presents</div>
    <h2>Template <span>Game</span></h2>
    <p>One or two lines selling the game, in BDB-roast voice.</p>
    <ul class="k-how">
      <li><b>Tap</b> the BDB heads before they vanish.</li>
      <li><b>Space</b> or <b>P</b> pauses.</li>
    </ul>
    <div class="k-row"><button type="button" class="k-btn primary big" id="play">Play</button></div>
  </div>
</section>

<div class="k-app">
  <header class="k-top">
    <a class="k-home" href="../" aria-label="All games">←<span> All games</span></a>
    <div class="k-brand">Template <span>Game</span></div>
    <div class="k-spacer"></div>
    <span class="k-pill">Best <span class="k-led" id="best">0</span></span>
    <button type="button" class="k-pill" id="mute" aria-label="Sound">Sound on</button>
  </header>
  <main class="k-stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="k-float k-hud k-jumbo">
      <div class="cell"><small>Score</small><b id="hScore">0</b></div>
      <div class="cell"><small>Time</small><b id="hTime">30</b></div>
    </div>
    <div class="k-float k-say quiet" id="say" aria-live="polite"><span class="av" aria-hidden="true"></span><div class="bub"><span class="tag"></span><span class="txt"></span></div></div>
    <nav class="k-float k-dock" aria-label="Game controls">
      <button type="button" class="k-dk primary" id="restart"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Restart</button>
      <button type="button" class="k-dk" id="pause"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>Pause</button>
    </nav>
  </main>
</div>

<div class="k-modal" id="end" hidden>
  <div class="k-box">
    <div class="bigav"></div>
    <div class="k-eyebrow" id="endEyebrow">Final buzzer</div>
    <h3 id="endTitle"></h3>
    <p id="endLine"></p>
    <div class="k-jumbo k-stats" id="endStats"></div>
    <div id="endScoresWrap" style="width:100%"><div class="k-label" style="margin-bottom:8px">Your top 5 on this device</div><ol class="k-scores" id="endScores"></ol></div>
    <div class="k-row"><button type="button" class="k-btn primary" id="again">Run it back</button><a class="k-btn" href="../" style="text-decoration:none">All games</a></div>
  </div>
</div>

<script>
/* ===== GAME ===== */
BDB.init({game:'template', extra: []});          // extra: game-only roast lines
const $ = id => document.getElementById(id);
const cv = $('cv'), cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  const r = $('stage').getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
new ResizeObserver(resize).observe($('stage')); resize();

const MISS = ["Missed. BDB-level shot selection.", "Whiff. He's proud of you.", "That's a 2.0 PPG kind of tap."];
let state = 'menu', score = 0, timeLeft = 30, heads = [], paused = false, spawnT = 0;
$('best').textContent = BDB.fmt((BDB.scores()[0] || {s:0}).s);

function start(){
  BDB.hideSplash(); BDB.hideEnd();
  state = 'play'; paused = false; score = 0; timeLeft = 30; heads = []; spawnT = 0;
  BDB.roast(); BDB.shout('GO');
}
function end(){
  state = 'over';
  const res = BDB.addScore(score);
  $('best').textContent = BDB.fmt(res.list[0].s);
  if (res.isBest) BDB.sfx.big(); else BDB.sfx.bad();
  BDB.showEnd({eyebrow:'Time', title: res.isBest ? 'New best' : `${score} heads`, line: BDB.pick(["BDB's never scored that many in his life.", "Respectable. He'd still talk trash."]),
    stats:[['Score', BDB.fmt(score)]], scores:res});
}
cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || paused) return;
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const hit = heads.findIndex(h => Math.hypot(h.x - x, h.y - y) < h.r);
  if (hit >= 0){ heads.splice(hit, 1); score++; BDB.sfx.good(); if (score % 10 === 0) BDB.roast(); }
  else { BDB.sfx.bad(); if (Math.random() < .3) BDB.line(MISS); }
});
function togglePause(){ if (state !== 'play') return; paused = !paused; $('pause').lastChild.textContent = paused ? 'Resume' : 'Pause'; }
$('play').onclick = start; $('again').onclick = start; $('restart').onclick = start; $('pause').onclick = togglePause;
$('mute').onclick = () => { $('mute').textContent = BDB.sfx.toggle() ? 'Sound off' : 'Sound on'; };
$('mute').textContent = BDB.sfx.muted ? 'Sound off' : 'Sound on';
addEventListener('keydown', e => {
  if (e.key === ' ' || e.key.toLowerCase() === 'p'){ e.preventDefault(); if (state === 'menu') start(); else togglePause(); }
  if (e.key === 'Enter' && state !== 'play') start();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play' && !paused) togglePause(); });

let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state === 'play' && !paused){
    timeLeft -= dt; spawnT -= dt;
    if (spawnT <= 0){ spawnT = .6; heads.push({x: 40 + Math.random() * (W - 80), y: 80 + Math.random() * (H - 200), r: 34, life: 1.4}); }
    heads.forEach(h => h.life -= dt); heads = heads.filter(h => h.life > 0);
    if (timeLeft <= 0){ timeLeft = 0; end(); }
  }
  $('hScore').textContent = score; $('hTime').textContent = Math.ceil(timeLeft);
  cx.clearRect(0, 0, W, H);
  for (const h of heads){
    cx.save(); cx.beginPath(); cx.arc(h.x, h.y, h.r, 0, Math.PI * 2); cx.clip();
    if (BDB.faceImg.complete) cx.drawImage(BDB.faceImg, h.x - h.r, h.y - h.r, h.r * 2, h.r * 2);
    cx.restore();
    cx.lineWidth = 3; cx.strokeStyle = '#ff8a2b'; cx.beginPath(); cx.arc(h.x, h.y, h.r, 0, Math.PI * 2); cx.stroke();
  }
  if (paused){ cx.fillStyle = 'rgba(3,8,20,.6)'; cx.fillRect(0, 0, W, H); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { get state(){ return state; }, get score(){ return score; } };   // hook for automated checks
</script>
</body>
</html>
